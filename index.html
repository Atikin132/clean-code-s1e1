<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link 
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    rel="stylesheet">
  <link
    rel="stylesheet" 
    href="style.css" 
    media="screen" 
    charset="utf-8">
</head>
<body class="page">
  <header>
    <div class="about-container">
      <img class="about-container__img" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix">
      <a
        class="about-container__link" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >Want more details?
      </a>
    </div> 
  </header>
  <main>
    <div class="main-container">
      <section id="add-item-section" class="add-item-section">
        <h3 class="add-item-section__title section-title">Add Item</h3>
        <div class="task-wrapper">
          <input id="new-task" class="add-item-section__input task input-task" type="text">
          <button class="button">Add</button>
        </div>
      </section>
      <section>
        <h3 class="section-title">Todo</h3>
        <ul id="incomplete-tasks">
          <li class="list-item">
            <input type="checkbox" class="task-check">
            <label class="list-item__label task">Pay Bills</label>
            <input type="text" class="list-item__input task input-task">
            <button class="button edit-btn">Edit</button>
            <button class="button delete-btn">
              <img class="delete-btn__img" src="./remove.svg" alt="Delete button">
            </button>
          </li>
          <li class="list-item edit-mode">
            <input type="checkbox" class="task-check">
            <label class="list-item__label task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="list-item__input task input-task">
            <button class="button edit-btn">Save</button>
            <button class="button delete-btn">
              <img class="delete-btn__img" src="./remove.svg" alt="Delete button">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h3 class="section-title">Completed</h3>
        <ul id="completed-tasks" class="completed-tasks">
          <li class="list-item">
            <input type="checkbox" class="task-check" checked>
            <label class="list-item__label task">See the Doctor</label>
            <input type="text" class="list-item__input task input-task">
            <button class="button edit-btn">Edit</button>
            <button class="button delete-btn">
              <img class="delete-btn__img" src="./remove.svg" alt="Delete button">
            </button>
          </li>
        </ul>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
